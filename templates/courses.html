{% extends "base.html" %}{% block title %}Courses{% endblock %}{% block heading %}Courses{% endblock %}
{% block content %}<form class="panel row" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<div style="width:140px"><label>Code</label><input name="code" maxlength="10" required></div><div style="flex:1;min-width:200px"><label>Name</label><input name="name" maxlength="40" required></div>
<div style="width:100px"><label>Credits</label><input name="credits" type="number" min="1" max="10" value="3"></div><button class="btn">+ Add course</button></form>
<div class="panel"><table><thead><tr><th>Code</th><th>Name</th><th class="num">Credits</th><th class="num">Enrolled</th><th></th></tr></thead><tbody>
{% for c in rows %}<tr><td><b>{{ c['code'] }}</b></td><td>{{ c['name'] }}</td><td class="num">{{ c['credits'] }}</td><td class="num">{{ c['enrolled'] }}</td>
<td><form class="inl" method="post" action="{{ url_for('course_delete', code=c['code']) }}" onsubmit="return confirm('Delete this course?')"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn d s">Delete</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
