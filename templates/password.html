{% extends "base.html" %}{% block title %}Change Password{% endblock %}{% block heading %}Change Password{% endblock %}
{% block content %}<div class="panel" style="max-width:460px"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Current password</label><input type="password" name="old" required>
<label style="margin-top:12px">New password (6 to 20 characters)</label><input type="password" name="new" required minlength="6" maxlength="20">
<label style="margin-top:12px">Confirm new password</label><input type="password" name="again" required>
<button class="btn" style="margin-top:18px">Change password</button></form></div>{% endblock %}
